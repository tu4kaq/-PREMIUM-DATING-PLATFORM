    const un=DB.on((type:string,d:any)=>{
      const me=DB.me();
      if(type==='match'){setMatchQ(q=>[...q,d]);if(me?.notify?.matches!==false)Sound.match();}
      if(type==='message'){const active=parseRoute();const isOpen=active.view==='messages'&&active.chatId===d.mid;if(isOpen){DB.markRead(d.mid);}else if(me?.notify?.messages!==false){Sound.msg();toast('Новое сообщение'+(d.other?' от '+d.other.name:''),'message');}}
      if(type==='like'){if(me?.notify?.likes!==false){Sound.fav();toast(d.other.name+' отправила вам симпатию ✦','info',{label:'Посмотреть',fn:()=>nav('/matches')});}}
      if(type==='typing'){setTyping((t:any)=>({...t,[d.mid]:d.on}));}
    });
    const wake=()=>Sound.ensure();document.addEventListener('pointerdown',wake);
    return()=>{un();document.removeEventListener('pointerdown',wake);};
  },[session?.id]);
  useEffect(()=>{if(session&&DB.mode==='demo')DB.ambient();return()=>{if(DB.clearTimers&&route.view==='landing')DB.clearTimers();};},[session?.id]);
  useEffect(()=>{setTyping({});setMatchQ([]);},[session?.id]);
  const setF=useCallback((patch:any)=>{setFState(prev=>{const next={...prev,...patch};if(prefTimer.current)clearTimeout(prefTimer.current);prefTimer.current=setTimeout(()=>DB.savePrefs(next),350);return next;});},[]);
  const me=DB.me();
  const doLike=useCallback(async(p:Profile)=>{
    try{Sound.like();const r=await DB.like(p.id);lastAction.current={type:'like',id:p.id,matched:!!r.match};
      if(!r.match)toast('Симпатия отправлена: '+p.name,'success',{label:'Отменить',fn:async()=>{try{await DB.undoLike(p.id);toast('Симпатия отменена','info');}catch(e:any){toast(e.message,'danger');}}});
    }catch(e:any){toast(e.message,'danger');}
  },[]);
  const doPass=useCallback(async(p:Profile)=>{Sound.nope();await DB.pass(p.id);lastAction.current={type:'pass',id:p.id};toast('Пропущено: '+p.name,'info',{label:'Вернуть',fn:async()=>{await DB.undoPass(p.id);toast('Анкета возвращена в ленту','success');}});},[]);
  const doFav=useCallback(async(p:Profile)=>{const added=await DB.toggleFav(p.id);Sound.fav();toast(added?p.name+' — в избранном ★':'Убрано из избранного',added?'success':'info');},[]);
  const undoLast=useCallback(async()=>{const a=lastAction.current;if(!a)return toast('Нечего возвращать','info');
    try{if(a.type==='like'){if(a.matched)return toast('Совпадение уже создано — отменить нельзя','danger');await DB.undoLike(a.id);toast('Симпатия отменена, анкета возвращена','success');}else{await DB.undoPass(a.id);toast('Анкета возвращена','success');}lastAction.current=null;}catch(e:any){toast(e.message,'danger');}},[]);
  const logout=useCallback(async()=>{await DB.signOut();await refreshSession();nav('/');toast('Вы вышли из аккаунта. До встречи ✦','info');},[]);
  const demoLogin=useCallback(async()=>{if(DB.mode!=='demo'){store.del('iskra_sb');DB=new LocalDriver();await DB.ready();}await DB.demoLogin();await refreshSession();toast('Демо-аккаунт Алекса открыт — смотрите, всё живое ✦','success');},[]);
  const toggleSound=useCallback(()=>{setSoundOn(s=>{const n=!s;Sound.on=n;if(me)DB.updateProfile({notify:{...me.notify,sound:n}});if(n)Sound.fav();return n;});},[me?.id]);
  if(!ready)return <div className="splash"><svg width="54" height="54" viewBox="0 0 24 24"><path fill="#FF5C8A" d="M12 1l2.4 7.2L22 12l-7.6 3.8L12 23l-2.4-7.2L2 12l7.6-3.8z"/></svg><div className="font-disp tracking-[.35em] font-bold">ИСКРА</div><div className="text-mute text-sm">подключаем данные…</div></div>;
  const guarded=['discover','filters','profile','matches','messages','settings'];
  const r=(!session&&guarded.includes(route.view))?{view:'auth',mode:'login'}:route;
  const ctx={me,session,f,setF,nav,route:r,toast,doLike,doPass,doFav,undoLast,logout,demoLogin,refreshSession,typing,soundOn,toggleSound,api:DB,report:(id:string)=>setReportPid(id),blockAsk:(id:string)=>setBlockPid(id)};
  let content:any=null;
  if(r.view==='landing')content=<Landing/>;
  else if(r.view==='auth')content=<Auth mode={r.mode}/>;
  else{
    const inner=r.view==='discover'?<Discover/>:r.view==='filters'?<FiltersPage/>:r.view==='profile'?<ProfilePage id={r.id}/>:r.view==='matches'?<MatchesPage/>:r.view==='messages'?<MessagesPage chatId={r.chatId}/>:r.view==='settings'?<SettingsPage tab={r.tab}/>:<DeployPage/>;
    content=<Shell route={r}>{inner}</Shell>;
  }
  const tIcon:any={success:['check','#3ECF8E'],danger:['alert','#FF4D5E'],info:['info','#6EA8FF'],message:['chat','#8B5CF6']};
  return <Ctx.Provider value={ctx}>
    {content}
    <AnimatePresence>{matchQ.length>0&&<MatchOverlay key={matchQ[0].match.id} data={matchQ[0]} onClose={()=>setMatchQ(q=>q.slice(1))}/>}</AnimatePresence>
    {reportPid&&<ReportModal pid={reportPid} onClose={()=>setReportPid(null)}/>}
    {blockPid&&<BlockModal pid={blockPid} onClose={()=>setBlockPid(null)}/>}
    <div className="fixed z-[95] bottom-24 lg:bottom-6 right-4 left-4 sm:left-auto sm:w-[340px] space-y-2.5 pointer-events-none">
      {toasts.map(t=><div key={t.id} className="toast pointer-events-auto glass-deep rounded-2xl p-3.5 shadow-card overflow-hidden">
        <div className="flex items-start gap-3">
          <span className="w-8 h-8 rounded-xl flex-none flex items-center justify-center" style={{background:(tIcon[t.type]?.[1]||'#6EA8FF')+'22',color:tIcon[t.type]?.[1]||'#6EA8FF',border:'1px solid '+(tIcon[t.type]?.[1]||'#6EA8FF')+'55'}}><Ic n={tIcon[t.type]?.[0]||'info'} s={15}/></span>
          <span className="text-[13px] text-snow leading-snug flex-1 pt-1">{t.msg}</span>
          {t.action&&<button className="text-xs font-bold text-rose hover:underline flex-none pt-1.5" onClick={()=>{t.action.fn();setToasts(x=>x.filter(y=>y.id!==t.id));}}>{t.action.label}</button>}
        </div>
        <div className="toast-bar mt-2.5"/>
      </div>)}
    </div>
  </Ctx.Provider>;
}
const root=ReactDOM.createRoot(document.getElementById('root')!);
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
